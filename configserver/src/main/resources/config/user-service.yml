spring:
  Data:
    mongodb:
      uri: mongodb://localhost:27017/userdb
      database: userdb
logging:
  file:
    name: logs/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-file-size: 5MB
      max-history: 7

